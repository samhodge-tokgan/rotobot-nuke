name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Dry-run tags (vX.Y.Z-rc*) build but do NOT publish — gives you a
    # chance to inspect the sdist contents on the Actions artefact tab
    # before pushing a real tag.
    if: ${{ !contains(github.ref_name, '-rc') }}
    environment:
      name: pypi
      url: https://pypi.org/p/rotobot-nuke
    permissions:
      id-token: write  # OIDC — trusted publisher
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
