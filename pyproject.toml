[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rotobot-nuke"
# NOT a literal. The version lives in src/rotobot_nuke/_version.py and is read
# from there, because it used to live here AND there with nothing comparing the
# two -- so `python -m build` took this one and `rotobot_nuke.__version__`
# reported the other. The v0.4.0 tag was cut without touching either and built
# rotobot_nuke-0.3.0, which PyPI would have rejected as a duplicate; the tag
# name never reaches the build.
dynamic = ["version"]
description = "Import Rotobot-Next lozenge_bezier_anim JSON into The Foundry's Nuke as a Roto node."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Sam Hodge", email = "sam.hodge@tokgan.com" }]
keywords = ["nuke", "rotobot", "roto", "vfx", "bezier", "spline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Graphics",
]
dependencies = []

[project.urls]
Homepage = "https://tokgan.com"
Source = "https://github.com/samhodge-tokgan/rotobot-nuke"
Issues = "https://github.com/samhodge-tokgan/rotobot-nuke/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
rotobot-undersample = "rotobot_nuke.undersample:_cli"

[tool.setuptools.dynamic]
# Points at the _version submodule, not at the package's own __version__ re-
# export: setuptools can read a bare literal assignment statically, so the
# build never has to import rotobot_nuke. __init__.py is pure Python today,
# but it would only take one `import nuke` creeping in to break every build.
version = { attr = "rotobot_nuke._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rotobot_nuke = ["py.typed"]
